{% set version = "0.8.0" %}

package:
  name: paddocktimeseries
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.11
    # Lab core + the five machine-wide data stores
    - borevitz-lab
    - pysentinel2
    - pysilo
    - pyozwald
    - pycopdem
    - pyslga
    # Scientific / geospatial / ML stack
    - numpy
    - scipy
    - pandas
    - xarray
    - zarr
    - dask
    - rasterio
    - rioxarray
    - geopandas
    - shapely
    - pyproj
    - affine
    - netcdf4
    - matplotlib-base
    - pillow
    - opencv
    - rich
    - tabulate
    - statsmodels
    - scikit-learn
    - pysheds
    - cvxpy
    - ecos
    - datacube
    - segment-geospatial
    - pytorch
    - tensorflow

test:
  imports:
    - PaddockTS
    - PaddockTS.paths

about:
  home: https://github.com/thestochasticman/paddocktimeseries
  license: MIT
  license_file: LICENSE
  summary: Paddock-scale Sentinel-2 time series, segmentation, phenology and reports
