[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddocktimeseries"
version = "0.8.0"
description = "Paddock segmentation and time-series analysis from Sentinel-2 imagery"
readme = "README.md"
authors = [
  { name = "John Burley", email = "john.burley@anu.edu.au" },
  { name = "Yasar Adeel Ansari", email = "u6737670@anu.edu.au" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "remote sensing",
  "Earth observation",
  "sentinel-2",
  "satellite time series",
  "agricultural field boundaries",
  "field-level analysis",
  "vegetation phenology",
  "agroecosystem",
  "agricultural monitoring",
  "geospatial",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# The scientific / geospatial / ML stack (GDAL, rasterio, samgeo, torch,
# tensorflow, datacube, …) is provided by conda via environment.yml.
# Only the lab packages are declared here, pinned to their GitHub
# repositories so a plain `pip install .` pulls them without any extra
# channel or checkout.
dependencies = [
  "troi @ git+https://github.com/thestochasticman/troi.git",
  "pysentinel2 @ git+https://github.com/thestochasticman/pysentinel2.git",
  "pysilo @ git+https://github.com/thestochasticman/pysilo.git",
  "pyozwald @ git+https://github.com/thestochasticman/pyozwald.git",
  "pycopdem @ git+https://github.com/thestochasticman/pycopdem.git",
  "pyslga @ git+https://github.com/thestochasticman/pyslga.git",
]

[project.optional-dependencies]
tests = [
  "pytest",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-jupyter",
]
viewer = [
  "streamlit",
]

[project.urls]
Homepage = "https://github.com/johnburley3000/paddocktimeseries"
Repository = "https://github.com/johnburley3000/paddocktimeseries"
Issues = "https://github.com/johnburley3000/paddocktimeseries/issues"

[tool.pytest.ini_options]
# The offline unit suite lives in tests/. The scripts in test/ are
# end-to-end acceptance runs against live services (see
# test/about_testing.md) and are run manually, never collected.
testpaths = ["tests"]
markers = [
  "network: needs internet access to live data services (deselect with -m 'not network')",
  "slow: takes more than a minute",
]

[tool.setuptools.packages.find]
include = ["PaddockTS", "PaddockTS.*"]

[tool.setuptools.package-data]
"PaddockTS.FractionalCover._models" = ["*.tflite"]
