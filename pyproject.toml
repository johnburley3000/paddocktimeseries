[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddocktimeseries"
version = "0.8.0"
description = "Paddock segmentation and time-series analysis from Sentinel-2 imagery"
readme = "README.md"
authors = [
  { name = "Borevitz Lab, Australian National University" },
  { name = "Yasar Adeel Ansari", email = "u6737670@anu.edu.au" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "remote-sensing",
  "sentinel-2",
  "agriculture",
  "phenology",
  "segmentation",
  "fractional-cover",
  "time-series",
  "geospatial",
  "paddock",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# The scientific / geospatial / ML stack (GDAL, rasterio, samgeo, torch,
# tensorflow, datacube, …) is provided by conda via environment.yml.
# Only the lab packages are declared here so `pip install -e .` is fast
# and doesn't re-resolve the native stack.
dependencies = [
  "borevitz-lab",
  "pysentinel2",
  "pysilo",
  "pyozwald",
  "pycopdem",
  "pyslga",
]

[project.optional-dependencies]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-jupyter",
]
viewer = [
  "streamlit",
]

[project.urls]
Homepage = "https://github.com/thestochasticman/paddocktimeseries"
Repository = "https://github.com/thestochasticman/paddocktimeseries"
Issues = "https://github.com/thestochasticman/paddocktimeseries/issues"

[tool.setuptools.packages.find]
include = ["PaddockTS", "PaddockTS.*"]

[tool.setuptools.package-data]
"PaddockTS.FractionalCover._models" = ["*.tflite"]
