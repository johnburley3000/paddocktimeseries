[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddocktimeseries"
version = "0.8.0"
description = "Paddock segmentation and time-series analysis from Sentinel-2 imagery"
readme = "README.md"
authors = [
  { name = "John Burley", email = "john.burley@anu.edu.au" },
  { name = "Yasar Adeel Ansari", email = "u6737670@anu.edu.au" },
]
maintainers = [
  { name = "John T. Burley", email = "john.burley@anu.edu.au" },
  { name = "Yasar Adeel Ansari", email = "u6737670@anu.edu.au" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "remote sensing",
  "Earth observation",
  "sentinel-2",
  "satellite time series",
  "agricultural field boundaries",
  "field-level analysis",
  "vegetation phenology",
  "agroecosystem",
  "agricultural monitoring",
  "geospatial",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# The scientific / geospatial / ML stack (GDAL, rasterio, samgeo, torch,
# tensorflow, datacube, …) is provided by conda via environment.yml.
# Lab packages are installed directly from GitHub. The auxiliary data-store
# packages are pinned to exact revisions tested with this PaddockTS release.
# Troi remains unpinned because the downstream lab packages currently
# declare it from the repository default branch.
dependencies = [
  "troi-core @ git+https://github.com/thestochasticman/troi.git",
  "pysentinel2 @ git+https://github.com/thestochasticman/pysentinel2.git@d6c931e0fa3d60ce15f289e3f5495f6917793c94",
  "pysilo @ git+https://github.com/thestochasticman/pysilo.git@1b1d106cc47f68d59cb3a0ce5bdc3a9fd840c00a",
  "pyozwald @ git+https://github.com/thestochasticman/pyozwald.git@0e6e8323a04cb8d5566a4c3bda8b7f1d2ec5338f",
  "pycopdem @ git+https://github.com/thestochasticman/pycopdem.git@7e74bbfe273762cef8de4e4a52419145cf1fbedd",
  "pyslga @ git+https://github.com/thestochasticman/pyslga.git@a51f5824502300bc324ec4625b8dcbd7873d7dcf",
]

[project.optional-dependencies]
tests = [
  "pytest",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-jupyter",
]
viewer = [
  "streamlit",
]

[project.urls]
Homepage = "https://github.com/johnburley3000/paddocktimeseries"
Repository = "https://github.com/johnburley3000/paddocktimeseries"
Issues = "https://github.com/johnburley3000/paddocktimeseries/issues"
Documentation = "https://johnburley3000.github.io/paddocktimeseries/"
Preprint = "https://doi.org/10.31223/X5821Z"

[tool.pytest.ini_options]
# The offline unit suite lives in tests/. The scripts in test/ are
# end-to-end acceptance runs against live services (see
# test/about_testing.md) and are run manually, never collected.
testpaths = ["tests"]
markers = [
  "network: needs internet access to live data services (deselect with -m 'not network')",
  "slow: takes more than a minute",
]

[tool.setuptools.packages.find]
include = ["PaddockTS", "PaddockTS.*"]

[tool.setuptools.package-data]
"PaddockTS.FractionalCover._models" = ["*.tflite"]
