# Augments (or creates) the paddockts conda environment with
# PaddockTS's full stack (geospatial natives, SAM/samgeo, PyTorch,
# TensorFlow, ffmpeg):
#
#   conda env update -n paddockts -f environment.yml
#   conda activate paddockts
#   pip install .        # pulls troi + the data stores from GitHub
#
# Never use --prune: the env may be shared across lab repos.
name: paddockts
channels:
  - conda-forge
  - pytorch
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - samgeo
  - numpy
  - xarray
  - scipy
  - scikit-learn
  - rasterio
  - rioxarray
  - geopandas
  - shapely
  - dask
  - matplotlib
  - opencv
  - attrs
  - rich
  - typing_extensions
  - pystac-client
  - odc-stac
  - pytorch
  - pandas
  - pillow
  - pysheds
  - cvxpy
  - ecos
  - tensorflow<2.20
  - datacube
  - netcdf4
  - statsmodels
  - tabulate
